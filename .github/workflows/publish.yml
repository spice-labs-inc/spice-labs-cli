name: Publish The Spice Labs Surveyor CLI Container Images

# Publishing IS the release. A GitHub Release (vX.Y.Z tag, published) triggers
# the full build graph: JARs -> Maven Central + GHP, OSS image -> Docker Hub +
# GHCR. The edition images (spice-labs-cli-otpro, -it, -itpro) are published by
# surveyor-build, not here. survey.yml runs after this workflow via workflow_run
# (by name) to survey the published artifacts, so the workflow name above must
# not change without updating that trigger.
on:
  release:
    types: [published]

env:
  OWNER: spice-labs-inc
  PLATFORMS: linux/amd64,linux/arm64
  PUBLIC_DOCKER_IMAGE: spicelabs/spice-labs-cli

jobs:
  publish_jars:
    name: Publish CLI JARs to GitHub Packages and the release files
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.validate.outputs.VERSION }}
      auto-publish: ${{ steps.validate.outputs.auto_publish }}
      successor-ok: ${{ steps.validate.outputs.successor_ok }}
      previous: ${{ steps.validate.outputs.previous }}
      expected: ${{ steps.validate.outputs.expected }}
      thread-ts: ${{ steps.release-notification.outputs.thread-ts }}
      channel-id: ${{ steps.release-notification.outputs.channel-id }}
    steps:
      # A published release becomes Latest before its files exist, and
      # install.spicelabs.io and the wrapper's update check follow Latest. Point
      # Latest back at the newest release that has its files until this one does.
      - name: Keep the previous release as Latest until this one has its files
        if: ${{ !github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          if [ "$latest" = "$TAG" ]; then
            previous=$(gh api "repos/$REPO/releases?per_page=30" --jq "[.[] | select(.draft | not) | select(.prerelease | not) | select(.tag_name != \"$TAG\") | select(any(.assets[]; .name == \"install.sh\"))][0].tag_name // empty")
            if [ -n "$previous" ]; then
              gh release edit "$previous" -R "$REPO" --latest
              echo "Latest stays $previous until $TAG has its files."
            fi
          fi

      - name: Notify release
        id: release-notification
        uses: spice-labs-inc/action-release-notification@v3.3
        with:
          type: release
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          username-mapping: ${{ vars.GH_SLACK_USERNAME_MAPPING }}
          github-token: ${{ github.token }}

      - name: Checkout with LFS
        uses: actions/checkout@v6
        with:
          lfs: true
          ref: ${{ github.event.release.tag_name }}
          # Full history and tags: the successor check compares this release
          # tag against every previously released version.
          fetch-depth: 0

      - name: Validate the release tag
        id: validate
        env:
          # tag_name is "vX.Y.Z" (no refs/tags/ prefix) for the release event.
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git tag --list > /tmp/all-tags.txt
          python3 .github/scripts/check-release-tag.py \
            "${TAG_NAME}" /tmp/all-tags.txt >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21 and GitHub Maven auth
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
          server-id: github
          server-username: SpicyGrzl
          server-password: ${{ secrets.GH_TOKEN }}
          token: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          gpg-private-key: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

      - name: Write settings.xml for GitHub + Maven Central
        uses: ./.github/actions/maven-settings
        with:
          github-username: SpicyGrzl
          github-token: ${{ secrets.GH_TOKEN }}
          central-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          central-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          active-profile: github

      - name: Update version in pom.xml using Maven plugin
        run: ./mvnw --batch-mode versions:set -DnewVersion=${{ steps.validate.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Build and publish all jars to GitHub Packages
        id: build-jars-github
        run: ./mvnw --batch-mode clean deploy -P github
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME_SG }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

      - name: Write the CLI's command model for the Spice Labs MCP
        run: java -jar target/spice-labs-cli-*-fat.jar docs --json > cli-docs.json

      - name: Upload wrapper scripts, completions and the command model to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            spice
            spice.ps1
            install.sh
            install.ps1
            cli-docs.json

      - name: Mark this release as Latest now that it has its files
        if: ${{ !github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.event.release.tag_name }}" -R "${{ github.repository }}" --latest

  # Its own job so a Maven Central failure never holds back the release files
  # (install.spicelabs.io serves the latest release's install.sh) or the image.
  publish_central:
    name: Publish CLI JARs to Maven Central
    runs-on: ubuntu-24.04
    needs: publish_jars
    permissions:
      contents: read
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v6
        with:
          lfs: true
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 21 and Maven Central signing
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
          server-id: github
          server-username: SpicyGrzl
          server-password: ${{ secrets.GH_TOKEN }}
          token: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          gpg-private-key: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

      - name: Write settings.xml for GitHub + Maven Central
        uses: ./.github/actions/maven-settings
        with:
          github-username: SpicyGrzl
          github-token: ${{ secrets.GH_TOKEN }}
          central-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          central-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          active-profile: github

      - name: Update version in pom.xml using Maven plugin
        run: ./mvnw --batch-mode versions:set -DnewVersion=${{ needs.publish_jars.outputs.version }} -DgenerateBackupPoms=false

      # Maven comes from the wrapper (mvnw, .mvn/wrapper), pinned to 3.9.15, not from the runner image.
      # Maven 3.10 (ubuntu-24.04 since 2026-10-04) writes local-repository bookkeeping
      # (maven-metadata-local.xml, _remote.repositories) into central-publishing's staging
      # directory, the plugin bundles it, and Central rejects the deployment: "Bundle has
      # content that does NOT have a .pom file". spice-probe lost three versions to it.
      - name: Build and publish all jars to Maven Central
        run: |
          ./mvnw --batch-mode clean deploy -P maven-central \
            -Dcentral.autoPublish=${{ needs.publish_jars.outputs.auto-publish }}
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME_SG }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

      - name: Keep the Central bundle for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: ignore

  docker_image:
    name: Build and Push Docker Image (Docker Hub + GHCR)
    runs-on: ubuntu-24.04
    needs: publish_jars
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check if release is a pre-release
        id: prerelease
        run: |
          IS_PRERELEASE=$(gh release view ${{ github.ref_name }} --json isPrerelease -q '.isPrerelease')
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract metadata (tags, labels) for Docker Hub + GHCR
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.PUBLIC_DOCKER_IMAGE }}
            ghcr.io/${{ env.OWNER }}/spice-labs-cli
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.prerelease.outputs.is_prerelease == 'false' }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image (Docker Hub + GHCR)
        # Build from source so the entire image carries the release version
        # (the Dockerfile runs `mvn versions:set -DnewVersion=${VERSION}` before
        # `mvn package`). Multi-arch; pushes to both registries in one build.
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ env.PLATFORMS }}
          context: .
          target: spice
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.publish_jars.outputs.version }}
          secrets: |
            gh_token=${{ secrets.GH_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # This job exists to turn the run red -- `mvn deploy` succeeds even when the
  # deployment is only staged, so without it the run would go green with
  # nothing on Maven Central.
  confirm_central_release:
    name: Maven Central release awaiting confirmation
    needs: [publish_jars]
    if: always() && needs.publish_jars.outputs.successor-ok == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Flag release awaiting manual confirmation
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PREVIOUS: ${{ needs.publish_jars.outputs.previous }}
          EXPECTED: ${{ needs.publish_jars.outputs.expected }}
        run: |
          {
            echo "## :warning: Maven Central release awaiting manual confirmation"
            echo
            if [ -n "${PREVIOUS}" ]; then
              echo "\`${TAG_NAME}\` is not a natural successor to \`${PREVIOUS}\`."
              echo "Expected one of: ${EXPECTED}."
            else
              echo "\`${TAG_NAME}\` is lower than every existing release."
            fi
            echo
            echo "The deployment was uploaded and validated, but **has not been published**."
            echo "It is waiting in the [Central Portal](https://central.sonatype.com/publishing/deployments):"
            echo
            echo "- **Publish** it if this version number is deliberate."
            echo "- **Drop** it otherwise, then delete the \`${TAG_NAME}\` release and tag and cut the correct version."
            echo
            echo "GitHub Packages and the Docker images already carry \`${TAG_NAME}\`; clean those up too if you drop this."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Maven Central release awaiting confirmation::${TAG_NAME} was not published automatically${PREVIOUS:+ (does not follow ${PREVIOUS})}. The deployment is parked in the Central Portal and must be published or dropped by hand."
          exit 1

  notify:
    name: Notify deployment result
    needs: [publish_jars, publish_central, docker_image, confirm_central_release]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check deployment status
        id: deployment-status
        shell: bash
        run: |
          JAR_STATUS="${{ needs.publish_jars.result }}"
          CENTRAL_STATUS="${{ needs.publish_central.result }}"
          DOCKER_STATUS="${{ needs.docker_image.result }}"
          SUCCESSOR_OK="${{ needs.publish_jars.outputs.successor-ok }}"

          # Staged, not failed: the jars are uploaded and validated but parked in
          # the Central Portal pending a human decision. Reported as a failure
          # because nothing is on Maven Central yet, but named distinctly so it
          # is not mistaken for a broken build.
          if [ "$SUCCESSOR_OK" == "false" ]; then
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "message=⚠️ Awaiting manual confirmation in the Maven Central Portal." >> "$GITHUB_OUTPUT"
            echo "workflow_name=${{ github.workflow }} — AWAITING MANUAL CONFIRMATION in the Maven Central Portal" >> "$GITHUB_OUTPUT"
          elif [ "$JAR_STATUS" == "success" ] && [ "$CENTRAL_STATUS" == "success" ] && [ "$DOCKER_STATUS" == "success" ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "message=✅ All components deployed successfully!" >> "$GITHUB_OUTPUT"
            echo "workflow_name=${{ github.workflow }}" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            MESSAGE="❌ Deployment failed:"
            [ "$JAR_STATUS" != "success" ] && MESSAGE="$MESSAGE ❌ GitHub Packages and release files failed." || MESSAGE="$MESSAGE ✅ GitHub Packages and release files published."
            [ "$CENTRAL_STATUS" != "success" ] && MESSAGE="$MESSAGE ❌ Maven Central failed." || MESSAGE="$MESSAGE ✅ Maven Central published."
            [ "$DOCKER_STATUS" != "success" ] && MESSAGE="$MESSAGE ❌ Docker build/push failed." || MESSAGE="$MESSAGE ✅ Docker build/push succeeded."
            echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"
            echo "workflow_name=${{ github.workflow }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify deployment result
        uses: spice-labs-inc/action-release-notification@v3.3
        with:
          type: ${{ steps.deployment-status.outputs.overall_status == 'success' && 'deployment-success' || 'deployment-failure' }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          username-mapping: ${{ vars.GH_SLACK_USERNAME_MAPPING }}
          github-token: ${{ github.token }}
          workflow-name: ${{ steps.deployment-status.outputs.workflow_name }}
          environment: production
          thread-ts: ${{ needs.publish_jars.outputs.thread-ts }}
          channel-id: ${{ needs.publish_jars.outputs.channel-id }}

  export-otel:
    name: Export OpenTelemetry traces
    needs:
      - publish_jars
      - publish_central
      - docker_image
      - notify
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    steps:
      - name: Export workflow traces to OpenObserve
        uses: dash0hq/otel-cicd-action@v4
        with:
          otlpEndpoint: "https://openobserve-ingest.shared-services.scw.spicelabs.systems/api/default/v1/traces"
          otlpHeaders: "Authorization=Basic ${{ secrets.OPENOBSERVE_CI_AUTH }}"
          extraAttributes: "environment=ci"
          githubToken: "${{ secrets.GITHUB_TOKEN }}"
